name: Test
on: 
  pull_request:
    paths: ['go/excellent/**']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22'
      #- run: go mod init github.com/katayan3290/my-github-actions-repo/go/excellent
      #  working-directory: go/excellent
      - run: go test ./...
        working-directory: go/excellent
        
